<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1E2746"/><stop offset="0.55" stop-color="#121829"/><stop offset="1" stop-color="#0A0D17"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.62" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7C5CFA" stop-opacity="0.38"/><stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.06"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="pFill" x1="0.1" y1="0.95" x2="0.9" y2="0.05">
      <stop offset="0" stop-color="#14C8E8"/><stop offset="0.5" stop-color="#4F9BFF"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="pShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/><stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0.08"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dial" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#1A2340"/><stop offset="1" stop-color="#0B0F1C"/>
    </radialGradient>
    <linearGradient id="needle" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E9EEFF"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04060C" flood-opacity="0.65"/>
    </filter>
    <filter id="needleShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="pClip"><path id="pShape" d="M144 136 Q144 112 168 112 H284 A118 118 0 0 1 284 348 H210 V376 Q210 400 186 400 H168 Q144 400 144 376 Z M284 172 A58 58 0 1 0 284 288 A58 58 0 1 0 284 172 Z" fill-rule="evenodd"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#tile)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#tileGlow)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="110.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- P with depth -->
  <g filter="url(#shadow)">
    <path d="M144 136 Q144 112 168 112 H284 A118 118 0 0 1 284 348 H210 V376 Q210 400 186 400 H168 Q144 400 144 376 Z M284 172 A58 58 0 1 0 284 288 A58 58 0 1 0 284 172 Z" fill="url(#pFill)" fill-rule="evenodd"/>
  </g>
  <g clip-path="url(#pClip)">
    <rect x="130" y="100" width="300" height="320" fill="url(#pShine)"/>
  </g>
  <path d="M144 136 Q144 112 168 112 H284 A118 118 0 0 1 284 348 H210 V376 Q210 400 186 400 H168 Q144 400 144 376 Z M284 172 A58 58 0 1 0 284 288 A58 58 0 1 0 284 172 Z"
        fill="none" fill-rule="evenodd" stroke="url(#pEdge)" stroke-width="2.5"/>

  <!-- gauge dial in the counter -->
  <circle cx="284" cy="230" r="56" fill="url(#dial)"/>
  <g stroke="#FFFFFF" stroke-linecap="round">
    <path d="M247.4 266.6 L255.9 258.1" stroke-opacity="0.35" stroke-width="7"/>
    <path d="M232.2 230 H244.2" stroke-opacity="0.45" stroke-width="7"/>
    <path d="M247.4 193.4 L255.9 201.9" stroke-opacity="0.55" stroke-width="7"/>
    <path d="M284 178.2 V190.2" stroke-opacity="0.7" stroke-width="7"/>
    <path d="M320.6 193.4 L312.1 201.9" stroke="#22D3EE" stroke-opacity="1" stroke-width="7"/>
  </g>
  <!-- tapered needle pointing to the top-right tick -->
  <g filter="url(#needleShadow)">
    <path d="M276.6 237.4 L291.4 222.6 L318.5 195.5 Z" fill="url(#needle)" stroke="url(#needle)" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="284" cy="230" r="13" fill="#FFFFFF"/>
    <circle cx="284" cy="230" r="5.5" fill="#4F9BFF"/>
  </g>
</svg>
