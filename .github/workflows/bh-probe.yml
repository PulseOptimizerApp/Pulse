name: Brawlhalla probe
on:
  push:
    branches: [bh-more]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.brawlhalla.com/v1
          for p in steamid steam_id steamId steam_id64 steamid64 id; do printf "$p: "; curl -sS -w " HTTP %{http_code}\n" "$A/search?$p=76561197960287930" | head -c 300; echo; done
          for path in "player/search?steamid=76561197960287930" "search/steam?steamid=76561197960287930" "search/steamid/76561197960287930" "player/steam?steam_id=76561197960287930"; do printf "$path: "; curl -sS -w " HTTP %{http_code}\n" "$A/$path" | head -c 200; echo; done
