name: Brawlhalla probe
on:
  push:
    branches: [bh-fix]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - shell: bash
        run: |
          A=https://api.brawlhalla.com/v1
          for id in 5461700 139282598 110282750 32181827; do
            for m in all ranked_1v1 ranked_3v3; do
              printf "$id $m plain:"; curl -sS -o /dev/null -w "%{http_code}" "$A/player/stats?brawlhalla_id=$id&mode=$m"
              for k in 1 2 3; do printf " bust$k:"; curl -sS -o /dev/null -w "%{http_code}" "$A/player/stats?brawlhalla_id=$id&mode=$m&t=$RANDOM$k"; done
              printf " teams-bust:"; curl -sS -o /dev/null -w "%{http_code}" "$A/player/teams?brawlhalla_id=$id&t=$RANDOM"; echo
            done
          done
