name: Brawlhalla probe
on:
  push:
    branches: [bh-fix]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.brawlhalla.com/v1
          for i in $(seq 1 8); do
            for m in all ranked_1v1; do printf "$m "; curl -sS -o /tmp/o.json -w "%{http_code} %{size_download}\n" "$A/player/stats?brawlhalla_id=32181827&mode=$m"; done
            sleep 2
          done
          head -c 300 /tmp/o.json; echo
          curl -sS -o /tmp/p.json -w "%{http_code}\n" "$A/player/stats?brawlhalla_id=5989758&mode=ranked_1v1"; head -c 200 /tmp/p.json; echo
