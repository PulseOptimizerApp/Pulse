name: Mouse end-to-end (temporary)
on:
  push:
    branches: [mouse-blank]
jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - shell: bash
        run: ./tools/get-mouse-protocol.sh
      - run: dotnet test tests/PulseOptimizer.Tests/PulseOptimizer.Tests.csproj -c Release --filter "FullyQualifiedName~Mouse" --logger "console;verbosity=detailed"
