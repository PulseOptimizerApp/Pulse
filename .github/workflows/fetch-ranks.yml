name: Fetch Brawlhalla rank banners
# Temporary: downloads the rank banners from the Brawlhalla wiki into Assets, then deletes itself.
on:
  push:
    branches: [builds-dm-peak]
    paths: [.github/workflows/fetch-ranks.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and size
        run: |
          pip install pillow -q
          mkdir -p raw
          for t in Valhallan Diamond Platinum Gold Silver Bronze Tin; do
            curl -sfL -A "Mozilla/5.0 PulseOptimizer" "https://brawlhalla.wiki.gg/images/Banner_Rank_$t.png" -o raw/$t.png || echo "failed $t"
          done
          ls -la raw
          python3 - <<'PY'
          from PIL import Image
          import os
          for f in os.listdir('raw'):
              im = Image.open('raw/'+f).convert('RGBA')
              bbox = im.getbbox()
              if bbox: im = im.crop(bbox)
              h = 160
              w = round(im.width * h / im.height)
              im = im.resize((w, h), Image.LANCZOS)
              im.save('src/PulseOptimizer/Assets/Brawlhalla/rank-' + f.lower(), optimize=True)
              print(f, im.size)
          PY
      - name: Commit
        run: |
          git rm -q .github/workflows/fetch-ranks.yml
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add src/PulseOptimizer/Assets/Brawlhalla
          git commit -qm "Brawlhalla rank banners from the wiki; remove the temporary download workflow"
          git push
