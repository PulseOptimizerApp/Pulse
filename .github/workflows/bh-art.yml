name: Brawlhalla art probe
on:
  push:
    branches: [brawlhalla-2]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch portraits
        run: |
          set +e
          UA="PulseOptimizer/1.0 (https://github.com/PulseOptimizerApp/Pulse)"
          mkdir -p art/full art/small
          for p in 1 2; do curl -sS "https://api.brawlhalla.com/v1/static/legends?max_results=100&page=$p" >> /tmp/l.json; echo >> /tmp/l.json; done
          python3 - <<'P'
          import json
          names=[]
          for line in open('/tmp/l.json'):
              line=line.strip()
              if not line: continue
              d=json.loads(line)
              for l in d.get('legends',[]): names.append(l.get('bio_name') or l['legend_name'])
          open('/tmp/names.txt','w').write('\n'.join(sorted(set(names))))
          P
          wc -l /tmp/names.txt
          python3 - <<'P'
          import json
          ws=set()
          for line in open('/tmp/l.json'):
              line=line.strip()
              if not line: continue
              for l in json.loads(line).get('legends',[]): ws.add(l['weapon_one']); ws.add(l['weapon_two'])
          open('/tmp/weapons.txt','w').write('\n'.join(sorted(ws)))
          P
          cat /tmp/weapons.txt | tr '\n' ' '; echo
          get() { code=$(curl -sS -A "$UA" -L -o "$2" -w "%{http_code}" "https://brawlhalla.wiki.gg/images/$1"); [ "$code" = 200 ] && echo "GOT $1" || { rm -f "$2"; echo "NO $1 $code"; }; sleep 0.3; }
          mkdir -p art/full art/weapons
          for f in Bodvar Bödvar Qinghua QinghuaAndBaobao Qinghua_and_Baobao; do get "Portrait_$f.png" "art/full/$f.png"; done
          while read -r w; do
            for q in "$w" "Icon_$w" "Weapon_$w"; do
              curl -sS -A "$UA" "https://brawlhalla.wiki.gg/api.php?action=query&list=allimages&aiprefix=$q&ailimit=200&format=json" | python3 -c "import json,sys; print('$q', [i['name'] for i in json.load(sys.stdin)['query']['allimages'] if 'con' in i['name'].lower()][:8])"
            done
          done < /tmp/weapons.txt
      - name: Push
        run: |
          cd art
          git init -q -b bh-art
          git config user.name art; git config user.email art@users.noreply.github.com
          git add -A; git commit -qm art
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bh-art
