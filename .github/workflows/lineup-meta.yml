name: Lineup shots (temporary)
on:
  push:
    branches: [lineups-map]
permissions:
  contents: write
jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Game art
        run: |
          pip install pillow -q
          python tools/get-match-art.py src/PulseOptimizer/Assets/Matches
      - name: Render
        env:
          PULSE_LINEUP_SHOTS: ${{ github.workspace }}\shots
        timeout-minutes: 15
        run: dotnet test tests/PulseOptimizer.Tests/PulseOptimizer.Tests.csproj -c Release --filter "FullyQualifiedName~LineupShots|FullyQualifiedName~CoachTests" --logger "console;verbosity=normal"
      - name: Push the pictures to a scratch branch
        if: always()
        shell: bash
        run: |
          mkdir -p shots && cd shots
          git init -q -b lineup-shots-out
          git config user.name "shots"
          git config user.email "shots@users.noreply.github.com"
          git add -A
          git commit -qm "shots ${{ github.sha }}" --allow-empty
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lineup-shots-out
