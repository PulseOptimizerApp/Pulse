name: Lineup map data (temporary)
on:
  push:
    branches: [lineups-map]
    paths: [.github/workflows/lineup-meta.yml]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow -q && python tools/get-match-art.py out
      - name: Push the map data to a scratch branch
        run: |
          mkdir -p pub && cp out/meta.json pub/ && cp out/mini-*.png pub/ 2>/dev/null || true
          curl -s https://valorant-api.com/v1/maps > pub/maps-full.json
          cd pub && git init -q && git checkout -q -b lineup-meta-out && git add -A
          git -c user.name=Claude -c user.email=noreply@anthropic.com commit -qm "map data"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" lineup-meta-out
