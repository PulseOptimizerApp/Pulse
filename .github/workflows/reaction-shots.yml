name: Reaction screenshots

# Temporary (reaction-training only): renders the reaction trainer and the logo lightning for a visual check.
on:
  push:
    branches: [reaction-training]

permissions:
  contents: write

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Render
        env:
          PULSE_SHOTS: ${{ github.workspace }}\shots
        run: dotnet test tests/PulseOptimizer.Tests/PulseOptimizer.Tests.csproj -c Release --filter "FullyQualifiedName~PeekTrainerTests" --logger "console;verbosity=normal"
      - name: Push the pictures to a scratch branch
        if: always()
        shell: bash
        run: |
          cd shots
          git init -q -b reaction-shots
          git config user.name "shots"
          git config user.email "shots@users.noreply.github.com"
          git add -A
          git commit -qm "Reaction screenshots ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" reaction-shots
