name: Release fallback test
# Temporary: checks the download fallbacks work.
on:
  push:
    branches: [reliability]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normal download fills the PresentMon cache
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: ./tools/get-presentmon.ps1 -Out t1/PresentMon.exe -Cache cache
      - name: Fallbacks
        shell: pwsh
        env: { PULSE_TEST_FALLBACK: "1", GH_TOKEN: "${{ github.token }}" }
        run: |
          ./tools/get-presentmon.ps1 -Out t2/PresentMon.exe -Cache cache
          if ((Get-FileHash t1/PresentMon.exe).Hash -ne (Get-FileHash t2/PresentMon.exe).Hash) { throw "cached PresentMon differs" }
          ./tools/get-ffmpeg.ps1 -Zip t3/ffmpeg-win64.zip -HashOut t3/ffmpeg.sha256
          Get-Content t3/ffmpeg.sha256
          if ((Get-Item t3/ffmpeg-win64.zip).Length -lt 10mb) { throw "ffmpeg zip too small" }
          Write-Host "Fallbacks OK"
